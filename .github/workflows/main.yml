name: Aggiorna Classifica Volley

on:
  schedule:
    # Esegue ogni ora tra le 17:00 UTC e le 22:00 UTC di sabato
    - cron: '0 17-22 * * 6'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Imposta Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Installa Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Esegui lo Script
        # Passiamo la chiave API in modo sicuro allo script Python
        env:
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
        run: python main.py

      - name: Salva e Pubblica
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Aggiornamento dati completo e stato notifiche"
          # Ora salva anche i file .txt per ricordare le notifiche inviate
          file_pattern: "*.html *.txt"
